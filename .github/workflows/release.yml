name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build the installer and upload it as an artifact without
  # publishing anything, which is the cheap way to check bundling still works.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the installer
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on a manual run, which makes the action build without
          # creating a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Unsit ${{ github.ref_name }}
          releaseBody: |
            Windows installer. Unsigned, so SmartScreen will warn the first time —
            "More info" then "Run anyway".
          # Draft on purpose: the release notes are worth writing by hand before
          # anyone can download it.
          releaseDraft: true
          prerelease: false

      - name: Upload the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: unsit-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
