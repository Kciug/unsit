name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build the installer and upload it as an artifact without
  # publishing anything, which is the cheap way to check bundling still works.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the installer
        uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on a manual run, which makes the action build without
          # creating a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Unsit ${{ github.ref_name }}
          releaseBody: |
            Windows installer. Unsigned, so SmartScreen will warn the first time —
            "More info" then "Run anyway".
          # Draft on purpose: the release notes are worth writing by hand before
          # anyone can download it.
          releaseDraft: true
          prerelease: false
          # On a manual run there is no release to attach to, so keep the
          # installer as a workflow artifact instead. The action finds the
          # bundle itself, which beats hardcoding a path under target/.
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}
