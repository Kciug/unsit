name: CI

on:
  pull_request:
  # Direct pushes to main still get checked — v0.1 was built that way, and a
  # branch that skips review should not also skip CI.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows-only app: the `windows` crate will not build anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the frontend
        run: npm run check

      # Has to run before the Rust steps: tauri-build reads tauri.conf.json and
      # expects frontendDist to exist.
      - name: Build the frontend
        run: npm run build

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
