[package]
name = "unsit"
version = "0.1.0"
description = "A break reminder for Windows that knows whether you're working or gaming"
authors = ["Rafał Skrzypczyk"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on Windows.
name = "unsit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Shutdown"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"

# Plugins from the v0.1 list (autostart, single-instance, notification,
# global-shortcut) get added as they are wired up, so an unused dependency never
# breaks the build.

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
